services:
  - type: web
    name: sakhi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_TOOL_ITERATIONS
        value: "3"
      - key: MAX_MESSAGE_LENGTH
        value: "2000"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: HF_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
